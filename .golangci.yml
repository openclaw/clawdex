version: "2"

linters:
  enable:
    - asasalint
    - bidichk
    - bodyclose
    - canonicalheader
    - copyloopvar
    - dupword
    - durationcheck
    - errcheck
    - errchkjson
    - errorlint
    - exptostd
    - gocheckcompilerdirectives
    - gocritic
    - gomoddirectives
    - gosec
    - govet
    - intrange
    - ineffassign
    - makezero
    - misspell
    - modernize
    - nilerr
    - nilnesserr
    - noctx
    - nolintlint
    - nosprintfhostport
    - perfsprint
    - predeclared
    - rowserrcheck
    - sloglint
    - sqlclosecheck
    - staticcheck
    - testifylint
    - unconvert
    - unused
    - usetesting
    - usestdlibvars
    - wastedassign
  settings:
    gosec:
      excludes:
        - G101
        - G115
        - G202
        - G301
        - G304
  exclusions:
    rules:
      # Match the former standalone gosec scope; other linters still check tests.
      - path: _test\.go
        linters:
          - gosec

formatters:
  enable:
    - gofumpt
    - goimports
